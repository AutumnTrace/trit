[workspace]
resolver = "3"
members = ["crates/trit-kernels", "crates/trit-model", "crates/trit-cli", "crates/trit-wasm"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/AutumnTrace/trit"

[workspace.dependencies]
trit-kernels = { path = "crates/trit-kernels" }
trit-model = { path = "crates/trit-model" }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

[profile.bench]
codegen-units = 1
lto = "fat"
