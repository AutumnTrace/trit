version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    ignore:
      # CI runs Node 24; keep its types on the same major line.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: uv
    directory: /train
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
